# Build the static site and publish it to GitHub Pages.
# Bundles are NOT built here (CI has neither pcb-lab nor KiCad's 3D library): run
# `make release-bundle BOARD=<name>` locally and commit bundles/<name>/.
# Optional custom domain: set the repository variable PAGES_CNAME (e.g. review.spinup.fail).
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Unit tests (importer parity with the Python exporter)
        working-directory: web
        run: npx tsc --noEmit && npx vitest run
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
      # The browser download once stalled for 20+ min with no output (Firefox, cdn.playwright.dev,
      # 2026-10-26): cap each attempt and retry instead of hanging the deploy.
      - name: Install test browsers
        working-directory: web
        timeout-minutes: 15
        run: |
          ok=0
          for i in 1 2 3; do
            if timeout 240 npx playwright install --with-deps chromium firefox; then ok=1; break; fi
            echo "playwright install attempt $i failed or stalled; retrying"; sleep 10
          done
          [ "$ok" = 1 ]
      - name: Browser tests (selection, 3D picking, local boards, datasheet frame safety; Chromium + Firefox)
        working-directory: web
        timeout-minutes: 10
        run: npx playwright test --reporter=line
      - run: npm run build
        working-directory: web
      - name: Add bundles and CNAME
        run: |
          rm -rf web/dist/bundles
          cp -r bundles web/dist/bundles
          if [ -n "${{ vars.PAGES_CNAME }}" ]; then echo "${{ vars.PAGES_CNAME }}" > web/dist/CNAME; fi
          touch web/dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
