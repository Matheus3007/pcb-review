# Build the static site and publish it to GitHub Pages.
# Bundles are NOT built here (CI has neither pcb-lab nor KiCad's 3D library): run
# `make release-bundle BOARD=<name>` locally and commit bundles/<name>/.
# Optional custom domain: set the repository variable PAGES_CNAME (e.g. review.spinup.fail).
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Browser tests (selection, 3D picking)
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          npx playwright test --reporter=line
      - run: npm run build
        working-directory: web
      - name: Add bundles and CNAME
        run: |
          rm -rf web/dist/bundles
          cp -r bundles web/dist/bundles
          if [ -n "${{ vars.PAGES_CNAME }}" ]; then echo "${{ vars.PAGES_CNAME }}" > web/dist/CNAME; fi
          touch web/dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
